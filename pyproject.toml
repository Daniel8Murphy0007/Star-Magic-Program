[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "star-magic-program"
version = "0.71.0"
description = "UQFF Star-Magic-Program v0.71.0: PAPER_068 wired (globular clusters: M13 virial 41.6 km/s EXACT -> sigma 12.19 vs 12.1 measured; Omega Cen IMBH anchors 4.2e4/4.0e4 Msun with corrupt M-sigma formula marked OPEN per Rule D; f_Z formula malformed (negative) pinned; M_eff factor-100 slip caught; [UA] = 1e-4 reappears; SSq 13th role as BEC fraction; 3 falsifiable dispersion predictions). Q-064 queued. Wired 72/2255, gate 517/0. Registry 214 rows / 415 edges / 72 ledgers."
readme = "README.md"
authors = [
    { name = "Daniel T. Murphy", email = "daniel.murphy00@enrgyone.com" }
]
license = { text = "AGPL-3.0-or-later OR LicenseRef-StarMagic-Commercial" }
requires-python = ">=3.9"
keywords = [
    "unified field theory",
    "vacuum physics",
    "UQFF",
    "Star-Magic",
    "LENR",
    "cosmological constant",
    "Holmlid",
    "Di-Pseudo-Monopole",
    "DPM",
    "nuclear shell model",
    "Yang-Mills mass gap",
    "Millennium Prize problems",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Daniel8Murphy0007/Star-Magic-Program"
Source = "https://github.com/Daniel8Murphy0007/Star-Magic-Program"
Predecessor = "https://github.com/Daniel8Murphy0007/Star-Magic"
Issues = "https://github.com/Daniel8Murphy0007/Star-Magic-Program/issues"

[tool.setuptools]
py-modules = [
    "uqff_registry_primitives",
    "uqff_calculator",
    "uqff_fidelity_tests",
    "uqff_registry_status",
    "uqff_registry_graph",
    "uqff_registry_xgeo",
    "registry_generator",
]

[tool.setuptools.data-files]
"share/star-magic-program" = [
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "LICENSE-AGPL-3.0.txt",
    "LICENSE-MIT-INITIAL.txt",
    "NOTICE",
    "COMMERCIAL.md",
    "SESSION_LOG.md",
    "WHITEPAPER_INDEX.md",
    "_BUILD_LOG.md",
    "UNIFIED_REGISTRY_VERSION.txt",
    "UNIFIED_REGISTRY_PROGRAM_PLAN.md",
    "UNIFIED_REGISTRY_SCHEMA.md",
    "UNIFIED_REGISTRY_STATUS_REPORT.md",
    "UNIFIED_REGISTRY_FALSIFIABILITY.md",
    "UNIFIED_REGISTRY_RESULTS_TABLE.md",
]
