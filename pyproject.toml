[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "star-magic-program"
version = "0.397.0"
description = "Star-Magic UQFF calculator v0.397.0: THE CONNECTIVITY SHIP. 2,253 dispatches (2,308 keys), gate 5,835/0. PAPER_2257 two-stream architecture landmark + uqff_downhole_simulator v1.10-v1.13: quasi-live file-follower, real Modbus client (optional pymodbus, loopback-verified), connectivity-tier ladder, and a REAL-WELL profile catalogue - Volve 15/9-19 SR, Scorpio E1 (SA), Kennetcook #2 (NS, wrapped LAS + measured BHT 42C@1935m), provenance-mandatory. Next: PAPER_2258."
readme = "README.md"
authors = [
    { name = "Daniel T. Murphy", email = "daniel.murphy00@enrgyone.com" }
]
license = { text = "AGPL-3.0-or-later OR LicenseRef-StarMagic-Commercial" }
requires-python = ">=3.9"
dependencies = [
    "sympy>=1.12",
    "mpmath>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
]
keywords = [
    "unified field theory",
    "vacuum physics",
    "UQFF",
    "Star-Magic",
    "LENR",
    "cosmological constant",
    "Holmlid",
    "Di-Pseudo-Monopole",
    "DPM",
    "nuclear shell model",
    "Yang-Mills mass gap",
    "Millennium Prize problems",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Daniel8Murphy0007/Star-Magic-Program"
Source = "https://github.com/Daniel8Murphy0007/Star-Magic-Program"
Predecessor = "https://github.com/Daniel8Murphy0007/Star-Magic"
Issues = "https://github.com/Daniel8Murphy0007/Star-Magic-Program/issues"

[project.optional-dependencies]
modbus = ["pymodbus>=3.15"]
gui = ["PyQt6"]

[tool.setuptools]
packages = ["uqff_downhole_simulator"]
py-modules = ["uqff_session_closures", "uqff_fubii_variants", "uqff_ngc_catalog", "uqff_primitive_identities", "uqff_material_landmarks", "uqff_backbone_locks", "uqff_derived_functions", "uqff_derived_constants", 
    "uqff_registry_primitives",
    "uqff_calculator",
    "uqff_fidelity_tests",
    "uqff_registry_status",
    "uqff_registry_graph",
    "uqff_registry_xgeo",
    "registry_generator",
]

[tool.setuptools.data-files]
"share/star-magic-program" = [
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "LICENSE-AGPL-3.0.txt",
    "LICENSE-MIT-INITIAL.txt",
    "NOTICE",
    "COMMERCIAL.md",
    "SESSION_LOG.md",
    "WHITEPAPER_INDEX.md",
    "AUDIT_500_PAPER_REPORT.md",
    "_BUILD_LOG.md",
    "UNIFIED_REGISTRY_VERSION.txt",
    "UNIFIED_REGISTRY_PROGRAM_PLAN.md",
    "UNIFIED_REGISTRY_SCHEMA.md",
    "UNIFIED_REGISTRY_STATUS_REPORT.md",
    "reference/COMPLETE_UQFF_EQUATIONS_REFERENCE.pdf",
    "reference/Star-Magic_manuscript_v5.pdf",
    "reference/uqff_production_arxiv.pdf",
    "reference/UQFF_VALIDATION_SYNC_AUDIT.pdf",
    "UNIFIED_REGISTRY_XGEO_QUEUE.csv",
    "UNIFIED_REGISTRY_XGEO_ROUTES.csv",
    "UNIFIED_REGISTRY_XGEO_CONFIRMATIONS.csv",
    "UNIFIED_REGISTRY_XGEO_EXTRACTED.csv",
    "UNIFIED_REGISTRY_FALSIFIABILITY.md",
    "UNIFIED_REGISTRY_RESULTS_TABLE.md",
    "UNIFIED_REGISTRY_PREDICTIONS.csv",
    "UNIFIED_REGISTRY_PARADOX_CENSUS.csv",
    "UNIFIED_REGISTRY_RESIDUALS.csv",
    "UNIFIED_REGISTRY_EXACT_IDENTITIES.csv",
    "UNIFIED_REGISTRY_ANCHORS.csv",
    "UNIFIED_REGISTRY_OPEN_ITEMS.csv",
    "notebooks/00_quickstart.ipynb",
    "uqff_downhole_simulator/README.md",
    "uqff_downhole_simulator/sample_well_profile.csv",
    "uqff_downhole_simulator/example_register_map.json",
    "uqff_downhole_simulator/catalog/volve_15_9_19_sr_excerpt.las",
    "uqff_downhole_simulator/catalog/volve_15_9_19_sr_excerpt.provenance.json",
    "uqff_downhole_simulator/catalog/scorpio_e1_sa_excerpt.las",
    "uqff_downhole_simulator/catalog/scorpio_e1_sa_excerpt.provenance.json",
    "uqff_downhole_simulator/catalog/kennetcook_2_p129_excerpt.las",
    "uqff_downhole_simulator/catalog/kennetcook_2_p129_excerpt.provenance.json",
]
