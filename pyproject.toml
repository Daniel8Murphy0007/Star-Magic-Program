[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "star-magic-program"
version = "0.246.0"
description = "UQFF Star-Magic-Program v0.246.0: PAPER_242 wired (Q-227) - Rings of Relativity GAL-CLUS-022058s 9-term Einstein-ring lensing MUGE; static L_t=(GM/c^2r)*0.67=3.21e-4, T4 rho_UA/rho_SCm=1/F_TRZ=10 EXACT, H(z=0.5)=1.309 H0. Wired 246/2255, gate 1551/0. Registry 531 rows / 1129 edges / 246 ledgers (measured)."
readme = "README.md"
authors = [
    { name = "Daniel T. Murphy", email = "daniel.murphy00@enrgyone.com" }
]
license = { text = "AGPL-3.0-or-later OR LicenseRef-StarMagic-Commercial" }
requires-python = ">=3.9"
dependencies = [
    "sympy>=1.12",
    "mpmath>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
]
keywords = [
    "unified field theory",
    "vacuum physics",
    "UQFF",
    "Star-Magic",
    "LENR",
    "cosmological constant",
    "Holmlid",
    "Di-Pseudo-Monopole",
    "DPM",
    "nuclear shell model",
    "Yang-Mills mass gap",
    "Millennium Prize problems",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Daniel8Murphy0007/Star-Magic-Program"
Source = "https://github.com/Daniel8Murphy0007/Star-Magic-Program"
Predecessor = "https://github.com/Daniel8Murphy0007/Star-Magic"
Issues = "https://github.com/Daniel8Murphy0007/Star-Magic-Program/issues"

[tool.setuptools]
py-modules = [
    "uqff_registry_primitives",
    "uqff_calculator",
    "uqff_fidelity_tests",
    "uqff_registry_status",
    "uqff_registry_graph",
    "uqff_registry_xgeo",
    "registry_generator",
]

[tool.setuptools.data-files]
"share/star-magic-program" = [
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "LICENSE-AGPL-3.0.txt",
    "LICENSE-MIT-INITIAL.txt",
    "NOTICE",
    "COMMERCIAL.md",
    "SESSION_LOG.md",
    "WHITEPAPER_INDEX.md",
    "_BUILD_LOG.md",
    "UNIFIED_REGISTRY_VERSION.txt",
    "UNIFIED_REGISTRY_PROGRAM_PLAN.md",
    "UNIFIED_REGISTRY_SCHEMA.md",
    "UNIFIED_REGISTRY_STATUS_REPORT.md",
    "UNIFIED_REGISTRY_FALSIFIABILITY.md",
    "UNIFIED_REGISTRY_RESULTS_TABLE.md",
]
