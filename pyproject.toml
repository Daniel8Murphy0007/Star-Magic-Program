[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "star-magic-program"
version = "0.342.0"
description = "UQFF Star-Magic-Program v0.342.0: complete-compile PAPER_001-080 (342 dispatches, 0 duplicates) PLUS a deep equation-library build to 410 named primitive-sourced callables — flagship UQFF closed forms now individually callable and verified: Lambda=rho_SCm*26!*25/12=5.957e-10 (Planck), proton mass 938.25 MeV from integers, H_0=A_5+SO_5=70 EXACT, Omega_L=0.684, U_i=2.75e-7 (Sun), Higgs vev 246 GeV. 4 authoritative reference PDFs bundled; SEMF relabeled observed (no SM). Gate green (2136 assertions)."
readme = "README.md"
authors = [
    { name = "Daniel T. Murphy", email = "daniel.murphy00@enrgyone.com" }
]
license = { text = "AGPL-3.0-or-later OR LicenseRef-StarMagic-Commercial" }
requires-python = ">=3.9"
dependencies = [
    "sympy>=1.12",
    "mpmath>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
]
keywords = [
    "unified field theory",
    "vacuum physics",
    "UQFF",
    "Star-Magic",
    "LENR",
    "cosmological constant",
    "Holmlid",
    "Di-Pseudo-Monopole",
    "DPM",
    "nuclear shell model",
    "Yang-Mills mass gap",
    "Millennium Prize problems",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Daniel8Murphy0007/Star-Magic-Program"
Source = "https://github.com/Daniel8Murphy0007/Star-Magic-Program"
Predecessor = "https://github.com/Daniel8Murphy0007/Star-Magic"
Issues = "https://github.com/Daniel8Murphy0007/Star-Magic-Program/issues"

[tool.setuptools]
py-modules = [
    "uqff_registry_primitives",
    "uqff_calculator",
    "uqff_fidelity_tests",
    "uqff_registry_status",
    "uqff_registry_graph",
    "uqff_registry_xgeo",
    "registry_generator",
]

[tool.setuptools.data-files]
"share/star-magic-program" = [
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "LICENSE-AGPL-3.0.txt",
    "LICENSE-MIT-INITIAL.txt",
    "NOTICE",
    "COMMERCIAL.md",
    "SESSION_LOG.md",
    "WHITEPAPER_INDEX.md",
    "_BUILD_LOG.md",
    "UNIFIED_REGISTRY_VERSION.txt",
    "UNIFIED_REGISTRY_PROGRAM_PLAN.md",
    "UNIFIED_REGISTRY_SCHEMA.md",
    "UNIFIED_REGISTRY_STATUS_REPORT.md",
    "reference/COMPLETE_UQFF_EQUATIONS_REFERENCE.pdf",
    "reference/Star-Magic_manuscript_v5.pdf",
    "reference/uqff_production_arxiv.pdf",
    "reference/UQFF_VALIDATION_SYNC_AUDIT.pdf",
    "UNIFIED_REGISTRY_XGEO_QUEUE.csv",
    "UNIFIED_REGISTRY_XGEO_ROUTES.csv",
    "UNIFIED_REGISTRY_XGEO_CONFIRMATIONS.csv",
    "UNIFIED_REGISTRY_XGEO_EXTRACTED.csv",
    "UNIFIED_REGISTRY_FALSIFIABILITY.md",
    "UNIFIED_REGISTRY_RESULTS_TABLE.md",
]
