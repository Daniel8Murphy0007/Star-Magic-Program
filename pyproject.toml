[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "star-magic-program"
version = "0.104.0"
description = "UQFF Star-Magic-Program v0.104.0: PAPER_101 wired (Yang-Mills mass gap - first Millennium paper: three-epoch supersession chain in one file resolved to the canonical 1.736 GeV (PAPER_1318, lattice 1.7, 2.1 pct) per self-rectification doctrine; S0 heuristic honestly labeled; x160 GeV-conversion defect + Ug4-family chain gap pinned; v_SCm-vs-v_F distinct-constants ruling queued). Q-097 queued. Wired 105/2255, gate 725/0. Registry 284 rows / 579 edges / 105 ledgers."
readme = "README.md"
authors = [
    { name = "Daniel T. Murphy", email = "daniel.murphy00@enrgyone.com" }
]
license = { text = "AGPL-3.0-or-later OR LicenseRef-StarMagic-Commercial" }
requires-python = ">=3.9"
keywords = [
    "unified field theory",
    "vacuum physics",
    "UQFF",
    "Star-Magic",
    "LENR",
    "cosmological constant",
    "Holmlid",
    "Di-Pseudo-Monopole",
    "DPM",
    "nuclear shell model",
    "Yang-Mills mass gap",
    "Millennium Prize problems",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Daniel8Murphy0007/Star-Magic-Program"
Source = "https://github.com/Daniel8Murphy0007/Star-Magic-Program"
Predecessor = "https://github.com/Daniel8Murphy0007/Star-Magic"
Issues = "https://github.com/Daniel8Murphy0007/Star-Magic-Program/issues"

[tool.setuptools]
py-modules = [
    "uqff_registry_primitives",
    "uqff_calculator",
    "uqff_fidelity_tests",
    "uqff_registry_status",
    "uqff_registry_graph",
    "uqff_registry_xgeo",
    "registry_generator",
]

[tool.setuptools.data-files]
"share/star-magic-program" = [
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "LICENSE-AGPL-3.0.txt",
    "LICENSE-MIT-INITIAL.txt",
    "NOTICE",
    "COMMERCIAL.md",
    "SESSION_LOG.md",
    "WHITEPAPER_INDEX.md",
    "_BUILD_LOG.md",
    "UNIFIED_REGISTRY_VERSION.txt",
    "UNIFIED_REGISTRY_PROGRAM_PLAN.md",
    "UNIFIED_REGISTRY_SCHEMA.md",
    "UNIFIED_REGISTRY_STATUS_REPORT.md",
    "UNIFIED_REGISTRY_FALSIFIABILITY.md",
    "UNIFIED_REGISTRY_RESULTS_TABLE.md",
]
