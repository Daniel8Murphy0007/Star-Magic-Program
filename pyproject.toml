[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "star-magic-program"
version = "0.222.0"
description = "UQFF Star-Magic-Program v0.222.0: PAPER_218 wired - NGC 3603 stellar pressure dispersal (1-P(t)); P=0.15 -> (1-P)=0.85 (15% reduction); g_base=G*M/r^2*(1-P)=7.22e-14 m/s^2 (M=1.6e4 M_sun); 5-term suppressor taxonomy; e_SFE 30-35%; sec-4 arithmetic drift (8.52e-52, 5% vs 15%) Q-214. Wired 222/2255, gate 1430/0. Registry 497 rows / 1055 edges / 222 ledgers (measured)."
readme = "README.md"
authors = [
    { name = "Daniel T. Murphy", email = "daniel.murphy00@enrgyone.com" }
]
license = { text = "AGPL-3.0-or-later OR LicenseRef-StarMagic-Commercial" }
requires-python = ">=3.9"
dependencies = [
    "sympy>=1.12",
    "mpmath>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
]
keywords = [
    "unified field theory",
    "vacuum physics",
    "UQFF",
    "Star-Magic",
    "LENR",
    "cosmological constant",
    "Holmlid",
    "Di-Pseudo-Monopole",
    "DPM",
    "nuclear shell model",
    "Yang-Mills mass gap",
    "Millennium Prize problems",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Daniel8Murphy0007/Star-Magic-Program"
Source = "https://github.com/Daniel8Murphy0007/Star-Magic-Program"
Predecessor = "https://github.com/Daniel8Murphy0007/Star-Magic"
Issues = "https://github.com/Daniel8Murphy0007/Star-Magic-Program/issues"

[tool.setuptools]
py-modules = [
    "uqff_registry_primitives",
    "uqff_calculator",
    "uqff_fidelity_tests",
    "uqff_registry_status",
    "uqff_registry_graph",
    "uqff_registry_xgeo",
    "registry_generator",
]

[tool.setuptools.data-files]
"share/star-magic-program" = [
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "LICENSE-AGPL-3.0.txt",
    "LICENSE-MIT-INITIAL.txt",
    "NOTICE",
    "COMMERCIAL.md",
    "SESSION_LOG.md",
    "WHITEPAPER_INDEX.md",
    "_BUILD_LOG.md",
    "UNIFIED_REGISTRY_VERSION.txt",
    "UNIFIED_REGISTRY_PROGRAM_PLAN.md",
    "UNIFIED_REGISTRY_SCHEMA.md",
    "UNIFIED_REGISTRY_STATUS_REPORT.md",
    "UNIFIED_REGISTRY_FALSIFIABILITY.md",
    "UNIFIED_REGISTRY_RESULTS_TABLE.md",
]
